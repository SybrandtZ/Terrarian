<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter Reader Template</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", cursive, sans-serif;
      background-color: #56453e;
      color: #f3ece7;
      display: flex;
      min-height: 100vh;
    }

    /* Left Sidebar */
    .sidebar {
      width: 175px;
      background-color: #56453e;
      border-right: 1.5px solid #1e1815;
      padding: 24px 20px;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 1.4rem;
      font-weight: normal;
      margin-bottom: 32px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.35);
    }

    .chapter-list {
      list-style: none;
    }

    .chapter-item {
      font-size: 1.25rem;
      line-height: 1.3;
      margin-bottom: 18px;
      cursor: pointer;
      color: #e2d8d2;
      transition: color 0.15s ease;
    }

    .chapter-item:hover,
    .chapter-item.active {
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    }

    /* Main Content Area */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #56453e;
    }

    /* Darker Top Header */
    .chapter-header {
      background-color: #4c3c36;
      height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
    }

    .chapter-header h1 {
      font-size: 2.3rem;
      font-weight: normal;
      color: #f3ece7;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
    }

    /* Content Body */
    .chapter-body {
      flex: 1;
      padding: 32px 48px;
      font-size: 1.15rem;
      line-height: 1.6;
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h2 class="sidebar-title">Chapters</h2>
    <ul id="chapter-list" class="chapter-list"></ul>
  </aside>

  <main class="main-container">
    <header class="chapter-header">
      <h1 id="chapter-title">The beginning</h1>
    </header>
    <section id="chapter-content" class="chapter-body"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
